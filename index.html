<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R.R. Patel Overseas - Staff Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
      color: #0b1c3d;
    }
    .bg-corporate { background-color: #0b1c3d; }
    .text-gold { color: #f39c12; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <header class="bg-corporate text-white px-4 py-3 shadow-md flex items-center space-x-3 sticky top-0 z-50">
    <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden">
      <span id="fallbackText" class="text-gold font-extrabold text-sm">RR</span>
      <img id="appLogo" class="w-full h-full object-cover hidden" alt="Logo">
    </div>
    <div>
      <h1 class="font-bold text-xs tracking-wide">R.R. PATEL OVERSEAS</h1>
      <p class="text-[9px] text-amber-400 font-semibold tracking-wider">WE PROVIDE SURETY</p>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4">
    <div id="empLoginCard" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-corporate">Employee Portal</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your assigned ID & Password</p>
      </div>

      <form id="empLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Employee ID</label>
          <input type="text" id="inputId" required placeholder="e.g. EMP001" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="inputPass" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <button type="submit" class="w-full bg-corporate text-amber-400 font-bold py-3 rounded-xl shadow-md text-sm hover:opacity-95">
          Login to App
        </button>
      </form>
    </div>

    <div id="empDash" class="hidden space-y-4">
      <div class="bg-corporate text-white rounded-2xl p-4 shadow-md flex justify-between items-center">
        <div>
          <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Welcome</span>
          <h3 id="empName" class="text-base font-bold">---</h3>
          <p id="empId" class="text-xs text-slate-300">ID: ---</p>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500/20 text-red-300 border border-red-500/30 px-3 py-1.5 rounded-lg font-semibold">
          Logout
        </button>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 text-center space-y-3">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Today's Attendance</h4>
        <div id="attBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">
          Not Checked In Today
        </div>
        <div class="grid grid-cols-2 gap-3 pt-2">
          <button onclick="markAttendance('Check In')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-sm">
            Check In ✅
          </button>
          <button onclick="markAttendance('Check Out')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-xs shadow-sm">
            Check Out ❌
          </button>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h4 class="text-xs font-bold text-corporate uppercase tracking-wider mb-3">My Attendance Log</h4>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
              <tr>
                <th class="p-2">Date</th>
                <th class="p-2">Type</th>
                <th class="p-2">Time</th>
              </tr>
            </thead>
            <tbody id="personalTable" class="divide-y divide-slate-100">
              <tr><td colspan="3" class="p-3 text-center text-slate-400">No logs found.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-[10px] text-slate-400 border-t border-slate-200 bg-white">
    R.R. Patel Overseas & Education Pvt. Ltd.
  </footer>

  <script>
    const STORAGE_KEY = 'rr_app_state_v1';

    function getAppState() {
      const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (!state.employees) state.employees = [];
      if (!state.attendance) state.attendance = [];
      if (!state.admin) state.admin = null;
      if (!state.logo) state.logo = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return state;
    }

    function saveAppState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    async function sha256(value) {
      const encoder = new TextEncoder();
      const data = encoder.encode(value);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function loadLogo() {
      const state = getAppState();
      const logo = state.logo;
      const img = document.getElementById('appLogo');
      const fallback = document.getElementById('fallbackText');
      if (logo) {
        img.src = logo;
        img.classList.remove('hidden');
        fallback.classList.add('hidden');
      } else {
        img.classList.remove('hidden');
        fallback.classList.remove('hidden');
      }
    }

    function showDash(user) {
      document.getElementById('empLoginCard').classList.add('hidden');
      document.getElementById('empDash').classList.remove('hidden');
      document.getElementById('empName').innerText = user.name;
      document.getElementById('empId').innerText = 'ID: ' + user.id;
      loadPersonalLogs(user.id);
      updateAttendanceStatus(user.id);
    }

    function logout() {
      localStorage.removeItem('rr_emp_session');
      location.reload();
    }

    function updateAttendanceStatus(empId) {
      const state = getAppState();
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = state.attendance.filter(log => log.empId === empId && log.date === today);

      if (todayLogs.length === 0) {
        document.getElementById('attBadge').innerText = 'Not Checked In Today';
        document.getElementById('attBadge').className = 'inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200';
        return;
      }

      const last = todayLogs[todayLogs.length - 1];
      document.getElementById('attBadge').innerText = `${last.type} logged at ${last.time}`;
      document.getElementById('attBadge').className = last.type === 'Check In'
        ? 'inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200'
        : 'inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('inputId').value.trim();
      const pass = document.getElementById('inputPass').value.trim();

      const state = getAppState();
      const found = state.employees.find(x => x.id.toLowerCase() === id.toLowerCase());

      if (!found) {
        alert('Invalid Employee ID or Password!');
        return;
      }

      const passHash = await sha256(pass);
      if (found.passwordHash !== passHash) {
        alert('Invalid Employee ID or Password!');
        return;
      }

      const sessionUser = { id: found.id, name: found.name };
      localStorage.setItem('rr_emp_session', JSON.stringify(sessionUser));
      showDash(sessionUser);
    }

    document.getElementById('empLoginForm').addEventListener('submit', handleLogin);

    function markAttendance(type) {
      const active = JSON.parse(localStorage.getItem('rr_emp_session') || 'null');
      if (!active) return;

      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const state = getAppState();
      const todayLogs = state.attendance.filter(log => log.empId === active.id && log.date === dateStr);

      if (todayLogs.length > 0 && todayLogs[todayLogs.length - 1].type === type) {
        alert(`${type} already recorded today.`);
        return;
      }

      state.attendance.push({
        empId: active.id,
        empName: active.name,
        type,
        date: dateStr,
        time: timeStr
      });

      saveAppState(state);

      document.getElementById('attBadge').innerText = `${type} logged at ${timeStr}`;
      document.getElementById('attBadge').className = type === 'Check In'
        ? 'inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200'
        : 'inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200';

      alert(`Attendance Marked: ${type}`);
      loadPersonalLogs(active.id);
    }

    function loadPersonalLogs(id) {
      const state = getAppState();
      const myLogs = (state.attendance || []).filter(x => x.empId === id).reverse();
      const table = document.getElementById('personalTable');

      table.innerHTML = '';

      if (myLogs.length === 0) {
        table.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-slate-400">No logs found.</td></tr>';
        return;
      }

      myLogs.forEach(log => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="p-2 font-medium">${log.date}</td>
          <td class="p-2">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${log.type === 'Check In' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
              ${log.type}
            </span>
          </td>
          <td class="p-2 text-slate-500">${log.time}</td>
        `;
        table.appendChild(row);
      });
    }

    window.onload = function() {
      loadLogo();
      const active = JSON.parse(localStorage.getItem('rr_emp_session') || 'null');
      if (active) {
        showDash(active);
      }
    };
  </script>
</body>
</html>
